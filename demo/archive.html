<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archive for AI Study — Archive</title>
  <style>
    :root{--ink:#172117;--muted:#627063;--faint:#8b958b;--line:rgba(23,33,23,.14);--paper:#f7f7f2;--card:#fff;--soft:#eceee7;--mint:#9cdec0;--violet:#bfb6f5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:-.022em}a{color:inherit;text-decoration:none}.header{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,72px);border-bottom:1px solid var(--line);background:#f7f7f2dd;backdrop-filter:blur(14px);position:sticky;top:0;z-index:3}.brand{font-weight:720;letter-spacing:-.07em;font-size:18px}.brand span{color:var(--muted)}nav{display:flex;gap:clamp(12px,1.65vw,24px);overflow:auto;font-size:13px;white-space:nowrap}nav a{color:var(--muted)}nav a:hover,nav a[aria-current=page]{color:var(--ink)}main{max-width:1280px;margin:auto;padding:clamp(54px,8vw,110px) clamp(20px,5vw,72px)}.eyebrow{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}.eyebrow::before{content:"";display:inline-block;width:18px;height:1px;margin:0 9px 3px 0;background:currentColor}h1{max-width:760px;margin:18px 0 20px;font-size:clamp(48px,7vw,94px);line-height:.9;letter-spacing:-.09em;font-weight:630}.intro{max-width:560px;color:var(--muted);font-size:17px;line-height:1.55}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:52px 0 23px}.filter{padding:9px 13px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--muted)}.filter:hover,.filter.active{background:var(--ink);border-color:var(--ink);color:var(--paper)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}.post{min-height:235px;padding:27px;background:var(--card);display:flex;flex-direction:column;transition:background .2s,transform .2s}.post:hover{background:var(--soft);transform:translateY(-3px)}.post .type{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}.post h2{margin:18px 0 auto;font-size:clamp(25px,3vw,39px);line-height:1.02;letter-spacing:-.07em;font-weight:620}.post p{margin:16px 0 0;color:var(--muted);font-size:14px;line-height:1.5}.post time{margin-top:18px;color:var(--faint);font-size:12px}.empty{padding:42px;background:var(--card);color:var(--muted);border:1px solid var(--line)}.cv{max-width:700px;padding:33px;border:1px solid var(--line);border-radius:22px;background:var(--card);box-shadow:0 16px 40px rgba(41,57,45,.08)}.cv h2{margin:12px 0;font-size:38px;letter-spacing:-.07em}.cv p{color:var(--muted);line-height:1.6}.cv a{display:inline-block;margin-top:12px;padding:11px 16px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:14px;font-weight:650}@media(max-width:620px){.header{height:64px}.header nav{max-width:calc(100vw - 170px)}main{padding-top:58px}.grid{grid-template-columns:1fr}.post{min-height:205px}}
  </style>
</head>
<body>
  <header class="header"><a class="brand" href="index.html">Archive for <span>AI Study</span></a><nav aria-label="Archive categories"><a href="archive.html?category=project">Project</a><a href="archive.html?category=study">Study</a><a href="archive.html?category=algorithm">Algorithm</a><a href="archive.html?category=weeklyreview">WeeklyReview</a><a href="archive.html?category=cv">CV</a><a href="archive.html?category=etc">ETC</a></nav></header>
  <main><div class="eyebrow">Hyejunl33 / archive</div><h1 id="title">Study archive</h1><p class="intro" id="intro">기존 블로그의 Markdown 글을 분류별로 읽는 데모입니다. 아래 항목은 원본 파일의 제목·날짜·요약을 사용합니다.</p><div class="filters" id="filters"></div><section class="grid" id="posts" aria-live="polite"></section><section class="cv" id="cv" hidden><div class="eyebrow">Existing material</div><h2>Curriculum vitae</h2><p>기존 블로그의 CV 데이터와 PDF는 그대로 보존합니다. 운영 전환 단계에서는 이 데이터를 타임라인 UI에 연결합니다.</p><a href="../Portfolio_Levit.pdf">Open existing CV PDF</a></section></main>
  <script>
    const posts=[
      {category:'project',date:'2026.01.30',title:'[이미지기반 카페추천 프로젝트] ADK 기반 에이전트 챗봇 구현',excerpt:'위치 처리, stateful 채팅, Context 기반 다음 질문 생성을 연결한 멀티 에이전트 구현 기록.',href:'article.html?post=adk-multi-agent'},
      {category:'project',date:'2026.01.30',title:'Airflow Pipeline',excerpt:'AI 파이프라인을 안정적으로 운영하기 위한 데이터 워크플로 기록.',href:'article.html?post=adk-multi-agent'},
      {category:'project',date:'2025.11.01',title:'TAPT',excerpt:'도메인 적응을 위한 task-adaptive pretraining 실험.',href:'article.html?post=wrapup-report'},
      {category:'algorithm',date:'2025.09.16',title:'[Programmers/Python] Level_3: N으로 표현',excerpt:'N을 사용하는 횟수에서 점화식을 찾아 DP로 풀어낸 풀이.',href:'article.html?post=n-expression'},
      {category:'algorithm',date:'2025.10.21',title:'Programmers Level 2',excerpt:'문제 풀이 과정과 알고리즘 사고의 기록.',href:'article.html?post=n-expression'},
      {category:'weeklyreview',date:'2025.11.03',title:'Week7-8 DomainCommonProject WrapupReport',excerpt:'영화 리뷰 다중 클래스 감성 분류 모델의 실험과 성능 개선 과정.',href:'article.html?post=wrapup-report'},
      {category:'weeklyreview',date:'2025.10.02',title:'NLP Week5',excerpt:'NLP 학습 과정에서의 핵심 개념과 실습 정리.',href:'article.html?post=wrapup-report'},
      {category:'etc',date:'2026.05.04',title:'평범한 교대생이던 내가 뤼튼에서 개발자?',excerpt:'합격부터 입사 전 준비, 그리고 AI Engineer 인턴으로의 첫 출근 기록.',href:'article.html?post=wrtn-onboarding'},
      {category:'etc',date:'2026.01.25',title:'Cowork',excerpt:'일과 협업, 성장에 관한 개인적인 기록.',href:'article.html?post=wrtn-onboarding'}
    ];
    const labels={project:'Project',study:'Study',algorithm:'Algorithm',weeklyreview:'WeeklyReview',cv:'CV',etc:'ETC'};
    const query=new URLSearchParams(location.search);const selected=query.get('category')||'study';
    const title=document.querySelector('#title'),intro=document.querySelector('#intro'),target=document.querySelector('#posts'),cv=document.querySelector('#cv'),filters=document.querySelector('#filters');
    document.querySelectorAll('nav a').forEach(a=>{if(a.href.includes(`category=${selected}`))a.setAttribute('aria-current','page')});
    Object.entries(labels).forEach(([key,label])=>{const a=document.createElement('a');a.className=`filter ${key===selected?'active':''}`;a.href=`archive.html?category=${key}`;a.textContent=label;filters.append(a)});
    if(selected==='cv'){title.textContent='CV, kept intact.';intro.textContent='현재 블로그의 CV JSON 및 PDF 자산은 바꾸지 않고, 이후 UI만 새 구조에 연결합니다.';target.hidden=true;cv.hidden=false}else{const visible=selected==='study'?posts:posts.filter(p=>p.category===selected);title.textContent=selected==='study'?'Study archive':`${labels[selected]} archive`;target.innerHTML=visible.map(p=>`<a class="post" href="${p.href}"><span class="type">${labels[p.category]} · ${p.date}</span><h2>${p.title}</h2><p>${p.excerpt}</p><time>${p.date}</time></a>`).join('')}
  </script>
</body>
</html>
