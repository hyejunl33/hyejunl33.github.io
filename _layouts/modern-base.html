<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f7f4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#10110f" media="(prefers-color-scheme: dark)">
    {% include seo.html %}
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/modern.css' | relative_url }}">
    <script>
      (function () {
        document.documentElement.classList.add('js');
        var saved = localStorage.getItem('archive-theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      }());
    </script>
  </head>
  <body class="modern-shell {{ page.body_class }}">
    {% include modern/header.html %}
    <main id="main-content" tabindex="-1">
      {{ content }}
    </main>
    {% include modern/footer.html %}
    <script src="{{ '/assets/js/modern-ui.js' | relative_url }}" defer></script>
    {% if page.math %}
      <script>
        window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }, svg: { fontCache: 'global' } };
      </script>
      <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" defer></script>
    {% endif %}
  </body>
</html>
